# p4studio build profile: tofino-model + bf_switchd with BF Runtime (gRPC).
# Kernel modules are disabled because they cannot be built inside a container.
global-options: { build_model: true }
features:
  drivers:
    kernel-modules: false
    bfrt: true
    bfrt-generic-flags: true
    grpc: true
  p4-examples:
    - p4-16-programs
architectures:
  - tofino
  - tofino2
